<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Felipe 8 Anos - Convite</title>
<meta name="description" content="Você está convidado para o aniversário de 8 anos do Felipe!">
<meta property="og:type" content="website">
<meta property="og:title" content="Felipe 8 Anos - Você está convidado!">
<meta property="og:description" content="28/11/26 • 18:00 às 22:00 • Gammer One">
<meta property="og:image" content="https://cauanascimento2009-star.github.io/convite-felipe-8/assets/preview.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:url" content="https://cauanascimento2009-star.github.io/convite-felipe-8/">
<meta name="theme-color" content="#0b1d4d">
<style>
:root{
  --azul:#1e6bff; --azul-esc:#0b1d4d; --vermelho:#e3141d; --branco:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;
  font-family:"Arial Black",system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent}

/* fundo desfocado */
.bg{position:fixed;inset:-40px;background:url(assets/banner.webp) center/cover no-repeat;
  filter:blur(24px) brightness(.6);transform:scale(1.08);z-index:0}

.phone{position:relative;z-index:1;width:100vw;height:100vh;height:100svh;display:flex;
  align-items:center;justify-content:center;overflow:hidden;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
@supports(height:100dvh){.phone{height:100dvh}}

.stage{position:relative;aspect-ratio:941/1672;width:min(100vw,calc(100svh * 941 / 1672));
  max-height:100%;overflow:hidden;background:#000;box-shadow:0 0 60px rgba(0,0,0,.6)}
@supports(height:100dvh){.stage{width:min(100vw,calc(100dvh * 941 / 1672))}}

.screen{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .7s ease,visibility 0s .7s}
.screen.on{opacity:1;visibility:visible;transition:opacity .7s ease}

/* capa e video: mídia quadrada centralizada sobre fundo desfocado */
.screen.media{background:#000}
.screen.media::before{content:"";position:absolute;inset:-30px;background:url(assets/capa.jpg) center/cover;
  filter:blur(20px) brightness(.55);transform:scale(1.1)}
.screen.media img,.screen.media video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}

#startBtn{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;cursor:pointer;z-index:5}
.tapHint{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);z-index:4;pointer-events:none;
  background:var(--vermelho);color:#fff;font-size:clamp(14px,4.2vw,20px);letter-spacing:.5px;
  padding:12px 22px;border-radius:14px;border:3px solid #fff;white-space:nowrap;
  box-shadow:0 6px 0 #8a0a10,0 10px 24px rgba(0,0,0,.5);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.07)}}

.pill{position:absolute;z-index:6;border:0;border-radius:999px;background:rgba(10,20,50,.85);color:#fff;
  font:700 12px/1 system-ui,-apple-system,Segoe UI,Roboto,Arial;padding:10px 14px;cursor:pointer;
  border:1px solid rgba(255,255,255,.25)}
#skipBtn{right:12px;bottom:calc(env(safe-area-inset-bottom) + 16px);display:none}
#replayBtn{left:12px;top:calc(env(safe-area-inset-top) + 12px)}
#muteBtn{right:12px;top:calc(env(safe-area-inset-top) + 12px)}

/* banner final */
#banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}
.hot{position:absolute;display:block;border-radius:18px;cursor:pointer}
.hot:focus-visible{outline:3px solid #fff}
.hot::after{content:"";position:absolute;inset:0;border-radius:18px;background:#fff;opacity:0;transition:opacity .15s}
.hot:active::after{opacity:.25}
#banner.on .hot{animation:glow 2.2s ease-in-out infinite}
#banner.on .hot:nth-child(3){animation-delay:.3s}
#banner.on .hot:nth-child(4){animation-delay:.6s}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}50%{box-shadow:0 0 18px 2px rgba(255,255,255,.45)}}

</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<div class="phone">
  <div class="stage">

    <!-- 1) CAPA -->
    <section id="cover" class="screen media on" aria-label="Capa">
      <img src="assets/capa.jpg" alt="Convite do Felipe - aperte para começar">
      <div class="tapHint">▶ TOQUE PARA ABRIR</div>
      <button id="startBtn" aria-label="Abrir convite"></button>
    </section>

    <!-- 2) VIDEO -->
    <section id="videoScreen" class="screen media" aria-label="Vídeo convite">
      <video id="video" src="assets/video.mp4" poster="assets/capa.jpg" playsinline webkit-playsinline preload="auto"></video>
      <button id="muteBtn" class="pill" type="button" style="display:none">🔊 Som</button>
      <button id="skipBtn" class="pill" type="button">Pular vídeo ⏭</button>
    </section>

    <!-- 3) BANNER CLICÁVEL -->
    <section id="banner" class="screen" aria-label="Informações da festa">
      <img src="assets/banner.webp" alt="Felipe 8 anos - 28/11/26, 18:00 às 22:00 - Gammer One" draggable="false">
      <a class="hot" id="lnkConfirm" target="_blank" rel="noopener" aria-label="Confirmar presença pelo WhatsApp"
         style="left:18.9%;top:65.6%;width:63.8%;height:7.9%"></a>
      <a class="hot" id="lnkMap" target="_blank" rel="noopener" aria-label="Ver localização: Gammer One"
         style="left:18.9%;top:74.0%;width:64.0%;height:6.9%"></a>
      <a class="hot" id="lnkGifts" target="_blank" rel="noopener" aria-label="Sugestões de presentes"
         style="left:18.9%;top:82.0%;width:64.8%;height:7.8%"></a>
      <button id="replayBtn" class="pill" type="button">↺ Ver vídeo</button>
    </section>


  </div>
</div>

<script>
/* =========================================================
   CONFIGURAÇÃO — edite aqui
   ========================================================= */
const CONFIG = {
  // WhatsApp: código do país + DDD + número, só dígitos
  whatsapp: "5519992458203",
  mensagem: "Oi! Confirmo minha presença no aniversário de 8 anos do Felipe! 🎮🎉",
  // Link do Google Maps do local
  mapa: "https://maps.app.goo.gl/UF6WQX8x8mvrrFa79",
  // Lista de sugestões de presentes
  presentes: "https://lista.mercadolivre.com.br/brinquedos-hobbies/brinquedo-crianca-8-anos"
};
/* ========================================================= */

const $ = id => document.getElementById(id);
const screens = ["cover","videoScreen","banner"].map($);
const video = $("video");
function show(id){ screens.forEach(s => s.classList.toggle("on", s.id === id)); }

// links
$("lnkConfirm").href = "https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(CONFIG.mensagem);
$("lnkMap").href = CONFIG.mapa;
$("lnkGifts").href = CONFIG.presentes;

// fluxo
function goBanner(){ try{ video.pause(); }catch(e){} $("skipBtn").style.display="none"; show("banner"); }

$("startBtn").addEventListener("click", () => {
  show("videoScreen");
  video.muted = false; video.currentTime = 0;
  const p = video.play();
  if (p && p.catch) p.catch(() => {           // navegador bloqueou som: toca mudo
    video.muted = true; $("muteBtn").style.display = "block"; video.play().catch(()=>{});
  });
  setTimeout(() => { if (!$("banner").classList.contains("on")) $("skipBtn").style.display = "block"; }, 4000);
});
$("muteBtn").addEventListener("click", () => { video.muted = false; $("muteBtn").style.display = "none"; });
video.addEventListener("ended", goBanner);
video.addEventListener("error", goBanner);
$("skipBtn").addEventListener("click", goBanner);
$("replayBtn").addEventListener("click", () => {
  show("videoScreen"); video.currentTime = 0; video.muted = false;
  video.play().catch(()=>{ video.muted = true; $("muteBtn").style.display="block"; video.play().catch(()=>{}); });
  setTimeout(() => { if ($("videoScreen").classList.contains("on")) $("skipBtn").style.display = "block"; }, 2000);
});
</script>
</body>
</html>
